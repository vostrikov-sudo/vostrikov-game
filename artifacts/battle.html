<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Сражение — Vostrikov Game</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    .game-wrap { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; background: #0a0a12; }
    #gameCanvas { border: 3px solid #1a1a28; border-radius: 4px; }
    .weapon-bar {
      display: flex; gap: 0.75rem; justify-content: center; padding: 0.5rem;
      font-family: 'Press Start 2P', cursive; font-size: 0.6rem;
    }
    .weapon-bar span {
      padding: 0.4rem 0.7rem; border-radius: 6px; background: #1a1a28; color: #888;
    }
    .weapon-bar span.active { background: #00e5c0; color: #000; }
  </style>
</head>
<body class="game-page">
  <div class="game-header">
    <a href="index.html">← Назад</a>
    <div class="score-board">
      <div>Очки: <span id="score">0</span></div>
      <div>Волна: <span id="wave">1</span></div>
      <div>HP: <span id="hp">100</span></div>
    </div>
  </div>

  <div class="weapon-bar">
    <span id="w1" class="active">1 Меч</span>
    <span id="w2">2 Пушка</span>
    <span id="w3">3 Дроны</span>
  </div>

  <div class="game-wrap">
    <canvas id="gameCanvas" width="900" height="500"></canvas>
    <div id="startOverlay" class="overlay-msg">
      <h2>Сражение</h2>
      <p>WASD / Стрелки — движение<br>ЛКМ / Пробел — атака<br>1 / 2 / 3 — смена оружия<br>Уничтожай танки, дроны и врагов!</p>
      <button class="btn-restart" id="startBtn">Начать</button>
    </div>
    <div id="gameOverOverlay" class="overlay-msg hidden">
      <h2>Поражение</h2>
      <p id="finalScore"></p>
      <button class="btn-restart" id="restartBtn">Ещё раз</button>
    </div>
  </div>

  <div class="game-controls">
    WASD / Стрелки · ЛКМ / Пробел — стрельба · 1-Меч 2-Пушка 3-Дроны
  </div>

  <script src="js/battle.js"></script>
</body>
</html>
